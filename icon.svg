      <stop offset="0%" stop-color="#123945"/>
      <stop offset="54%" stop-color="#081C24"/>
      <stop offset="100%" stop-color="#030B10"/>
    </radialGradient>
    <radialGradient id="planet" cx="38%" cy="30%" r="76%">
      <stop offset="0%" stop-color="#D9FAFF"/>
      <stop offset="18%" stop-color="#8BDCE7"/>
      <stop offset="52%" stop-color="#237889"/>
      <stop offset="82%" stop-color="#0A3542"/>
