name: Headless Tests

on:
  push:
    branches: [main, testing-main]
  pull_request:
    branches: [main]

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
      - name: Run complete nonrecursive corpus
        run: bash tools/run_tests.sh
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-test-logs
          path: build/test-logs/
